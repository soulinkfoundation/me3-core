<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ME3 Theme Lab</title>
<style>
:root{--bg:#f3f3f1;--panel:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:rgba(0,0,0,.09);--chip:#ececea;--on:#1d1d1f;--on-text:#fff;--shadow:0 1px 2px rgba(0,0,0,.06),0 12px 40px rgba(0,0,0,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#141415;--panel:#1d1d1f;--text:#f2f2f2;--muted:#9a9aa0;--line:rgba(255,255,255,.1);--chip:#2a2a2d;--on:#f2f2f2;--on-text:#141415;--shadow:0 1px 2px rgba(0,0,0,.4),0 12px 40px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:grid;margin-right:6px}
.brand strong{font-size:15px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12px}
.group{display:flex;align-items:center;gap:8px}
.group>label{color:var(--muted);font-size:12px}
.seg{display:flex;padding:3px;border-radius:10px;background:var(--chip)}
.seg button{position:relative;min-height:30px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--text);font:inherit;font-weight:500;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--on);color:var(--on-text)}
.seg button.own::after{content:"";position:absolute;top:5px;right:5px;width:5px;height:5px;border-radius:50%;background:#3d9b7c}
.spacer{flex:1}
.hint{color:var(--muted);font-size:12px}
.open{color:var(--text);font-size:12px;text-decoration:none;border-bottom:1px solid var(--line)}
main{flex:1;min-height:0;padding:20px;overflow:auto}
.stage{display:flex;gap:20px;align-items:flex-start;height:100%}
.frame{display:flex;flex-direction:column;gap:8px;min-width:0}
.frame figcaption{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.screen{position:relative;overflow:hidden;border-radius:12px;background:#000;box-shadow:var(--shadow)}
.screen iframe{position:absolute;top:0;left:0;border:0;transform-origin:0 0;background:#fff}
.desktop{flex:1}
.phone .screen{border-radius:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:22px}
.grid .frame{cursor:pointer}
.grid .frame:hover .screen{outline:2px solid var(--on);outline-offset:3px}
.grid .frame strong{color:var(--text)}
</style>
</head>
<body>
<header>
  <div class="brand"><strong>ME3 Theme Lab</strong><span id="source"></span></div>
  <div class="group"><label>Theme</label><div class="seg" id="theme"></div></div>
  <div class="group"><label>Layout</label><div class="seg" id="layout"></div></div>
  <div class="group"><label>Mode</label><div class="seg" id="mode"></div></div>
  <div class="group"><label>Polish</label><div class="seg" id="polish"></div></div>
  <div class="group"><label>View</label><div class="seg" id="view"></div></div>
  <div class="spacer"></div>
  <span class="hint">← → theme · ↑ ↓ layout · D mode · P polish</span>
  <a class="open" id="open" target="_blank">Open page ↗</a>
</header>
<main id="main"></main>
<script>
const M = /*MANIFEST*/null;
const DESKTOP = { w: 1440, h: 900 }, PHONE = { w: 390, h: 844 };
const options = {
  theme: M.themes.map(t => [t.id, t.name]),
  layout: M.layouts.map(l => [l, l[0].toUpperCase() + l.slice(1)]),
  mode: M.modes.map(m => [m, m[0].toUpperCase() + m.slice(1)]),
  polish: M.polish.map(p => [p, p[0].toUpperCase() + p.slice(1)]),
  view: [["both", "Desktop + phone"], ["desktop", "Desktop"], ["phone", "Phone"], ["themes", "All themes"]],
};
const own = { theme: M.ownTheme, layout: M.ownLayout };
const state = { theme: own.theme || M.themes[0].id, layout: own.layout || "card", mode: "light", polish: "current", view: "both" };
try { Object.assign(state, Object.fromEntries(new URLSearchParams(location.hash.slice(1)))); } catch {}
document.getElementById("source").textContent = `${M.name || "Profile"} · ${M.source}`;

const page = (s = state) => `pages/${s.polish}/${s.theme}-${s.layout}-${s.mode}.html`;

function renderControls() {
  for (const [key, list] of Object.entries(options)) {
    const el = document.getElementById(key);
    el.innerHTML = "";
    for (const [value, label] of list) {
      const b = document.createElement("button");
      b.textContent = label;
      b.setAttribute("aria-pressed", String(state[key] === value));
      if (own[key] === value) { b.classList.add("own"); b.title = "Your current choice"; }
      b.onclick = () => set({ [key]: value });
      el.append(b);
    }
  }
  document.getElementById("open").href = page();
  location.replace("#" + new URLSearchParams(state));
}

function screen(src, size, width) {
  const scale = width / size.w;
  const box = document.createElement("div");
  box.className = "screen";
  box.style.width = width + "px";
  box.style.height = Math.round(size.h * scale) + "px";
  const f = document.createElement("iframe");
  f.src = src; f.loading = "lazy";
  f.style.width = size.w + "px"; f.style.height = size.h + "px";
  f.style.transform = `scale(${scale})`;
  box.append(f);
  return box;
}

function frame(className, caption, src, size, width) {
  const fig = document.createElement("figure");
  fig.className = "frame " + className; fig.style.margin = "0";
  const cap = document.createElement("figcaption");
  cap.innerHTML = caption;
  fig.append(cap, screen(src, size, width));
  return fig;
}

function renderStage() {
  const main = document.getElementById("main");
  main.innerHTML = "";
  const avail = main.clientWidth - 40, availH = main.clientHeight - 70;
  if (state.view === "themes") {
    const grid = document.createElement("div"); grid.className = "grid"; main.append(grid);
    const cols = Math.max(1, Math.floor((avail + 22) / (420 + 22)));
    const w = Math.floor((avail - 22 * (cols - 1)) / cols);
    for (const t of M.themes) {
      const fig = frame("", `<strong>${t.name}</strong><span>${t.description}</span>`, page({ ...state, theme: t.id }), DESKTOP, w);
      fig.onclick = () => set({ theme: t.id, view: "both" });
      grid.append(fig);
    }
    return;
  }
  const stage = document.createElement("div"); stage.className = "stage"; main.append(stage);
  const phoneW = Math.min(PHONE.w, Math.floor(availH * PHONE.w / PHONE.h));
  if (state.view !== "phone") {
    const room = state.view === "both" ? avail - phoneW - 20 : avail;
    const w = Math.min(room, Math.floor(availH * DESKTOP.w / DESKTOP.h));
    stage.append(frame("desktop", `<span>Desktop · ${DESKTOP.w}px</span><span>${Math.round(w / DESKTOP.w * 100)}%</span>`, page(), DESKTOP, w));
  }
  if (state.view !== "desktop") stage.append(frame("phone", `<span>Phone · ${PHONE.w}px</span>`, page(), PHONE, phoneW));
}

function set(patch) { Object.assign(state, patch); renderControls(); renderStage(); }
function step(key, dir) {
  const list = options[key].map(o => o[0]);
  set({ [key]: list[(list.indexOf(state[key]) + dir + list.length) % list.length] });
}
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "ArrowRight") step("theme", 1);
  else if (e.key === "ArrowLeft") step("theme", -1);
  else if (e.key === "ArrowDown") { e.preventDefault(); step("layout", 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); step("layout", -1); }
  else if (e.key.toLowerCase() === "d") step("mode", 1);
  else if (e.key.toLowerCase() === "p") step("polish", 1);
});
addEventListener("hashchange", () => {
  const next = Object.fromEntries(new URLSearchParams(location.hash.slice(1)));
  if (Object.keys(next).some(k => next[k] !== String(state[k]))) set(next);
});
let t; addEventListener("resize", () => { clearTimeout(t); t = setTimeout(renderStage, 120); });
renderControls(); renderStage();
</script>
</body>
</html>
