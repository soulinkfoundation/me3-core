name: Claude Code

# Picks up @claude mentions on issues and pull requests. ME3's "Send to Claude" opens issues that
# mention @claude, so notes captured anywhere start a run here. When Claude pushes a branch for an
# issue, Claude opens the pull request for the owner to review and merge; the last step links it
# on the issue. Only people with
# write access can trigger a run.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(gh pr create:*)"
            --append-system-prompt "Follow AGENTS.md in this repository, except work on the branch this run gives you rather than main. Requests sent from ME3 are short notes, often captured on a phone; read the related code before changing it and keep the change to what the note asks. After you push, open a pull request for your branch with gh pr create against the default branch, with a body that starts with Closes #<issue number>, and link it in your reply instead of a Create PR link. Say in your reply what you could not build or test on this runner."

      - name: Link Claude's pull request on the issue
        if: steps.claude.outputs.branch_name != '' && github.event.issue.number && !github.event.issue.pull_request
        env:
          # The action revokes its app token when it finishes, so use the workflow token.
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          BASE: ${{ github.event.repository.default_branch }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          # The refs API takes branch names with slashes, such as claude/issue-1-20261018-1715.
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha 2>/dev/null) || {
            echo "Claude did not push a branch."; exit 0
          }
          if [ "$head" = "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BASE" --jq .object.sha)" ]; then
            echo "Claude's branch has no commits."; exit 0
          fi
          url=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state all --json url --jq '.[0].url')
          if [ -z "$url" ]; then
            # GitHub Actions may not be allowed to open pull requests here; fall back to a link.
            url=$(gh pr create -R "$GITHUB_REPOSITORY" --head "$BRANCH" --base "$BASE" --title "$ISSUE_TITLE" \
              --body "Closes #$ISSUE_NUMBER. Opened from Claude's branch \`$BRANCH\`; review before merging." 2>/dev/null) || {
              gh issue comment "$ISSUE_NUMBER" -R "$GITHUB_REPOSITORY" --body "**Claude finished.** Open the pull request: https://github.com/$GITHUB_REPOSITORY/compare/$BASE...$BRANCH?quick_pull=1"
              exit 0
            }
          fi
          gh issue comment "$ISSUE_NUMBER" -R "$GITHUB_REPOSITORY" --body "**Claude finished** and opened a pull request to review: $url"
