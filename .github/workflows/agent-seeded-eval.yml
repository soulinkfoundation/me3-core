name: Seeded agent integration eval

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-new-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check harness, write safety and streaming contracts
        run: node --import tsx --test scripts/agent-eval-seed.test.mjs scripts/agent-eval-scenarios.test.mjs scripts/agent-eval-report.test.mjs scripts/agent-eval-gateway.test.mjs scripts/agent-eval-budget.test.mjs
      - name: Check new runtime seeded plumbing
        run: pnpm eval:agent -- --runtime=new --repeat=1 --report=new-agent-eval.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-seeded-eval
          path: |
            *-agent-eval.json
            *-agent-eval.md
