name: Restore ME3 Move

# Dispatched once by ME3 Cloud when an owner moves from Hosted by ME3 to their
# own accounts. It restores the encrypted export into this install's empty D1
# database and file storage, then deploys. ME3 Cloud removes the move secrets
# from this repository when the run finishes.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: me3-move-restore
  cancel-in-progress: false

jobs:
  restore:
    name: Restore ME3 Move
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ME3_CORE_SOURCE_REPOSITORY: https://github.com/soulinkfoundation/me3-core.git

    steps:
      - name: Require move secrets
        env:
          ME3_MOVE_EXPORT_URL: ${{ secrets.ME3_MOVE_EXPORT_URL }}
          ME3_MOVE_EXPORT_TOKEN: ${{ secrets.ME3_MOVE_EXPORT_TOKEN }}
          ME3_MOVE_PASSPHRASE: ${{ secrets.ME3_MOVE_PASSPHRASE }}
        run: |
          set -euo pipefail
          echo "MOVE_DIR=$RUNNER_TEMP/me3-move" >> "$GITHUB_ENV"
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN ME3_MOVE_EXPORT_URL ME3_MOVE_EXPORT_TOKEN ME3_MOVE_PASSPHRASE; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set. Start the move again from ME3."
              exit 1
            fi
          done

      - name: Checkout ME3 install
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the export
        env:
          ME3_MOVE_EXPORT_URL: ${{ secrets.ME3_MOVE_EXPORT_URL }}
          ME3_MOVE_EXPORT_TOKEN: ${{ secrets.ME3_MOVE_EXPORT_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$MOVE_DIR"
          chmod 700 "$MOVE_DIR"
          node scripts/move-restore.mjs download --output "$MOVE_DIR/owner.me3export"

      - name: Unlock and check the export
        id: archive
        env:
          ME3_MANAGED_EXPORT_PASSPHRASE: ${{ secrets.ME3_MOVE_PASSPHRASE }}
        run: |
          set -euo pipefail
          node scripts/managed-export-envelope.mjs extract \
            --envelope "$MOVE_DIR/owner.me3export" \
            --output "$MOVE_DIR/portable" \
            --core-from archive > /dev/null
          rm -f "$MOVE_DIR/owner.me3export"
          tag="$(node scripts/move-restore.mjs core-tag --archive "$MOVE_DIR/portable")"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Check out the exported ME3 version
        env:
          SOURCE_TAG: ${{ steps.archive.outputs.tag }}
        run: |
          set -euo pipefail
          git clone --quiet --depth 1 --branch "$SOURCE_TAG" "$ME3_CORE_SOURCE_REPOSITORY" "$MOVE_DIR/source"
          pnpm --dir "$MOVE_DIR/source" install --frozen-lockfile

      - name: Restore data and files
        env:
          ME3_MOVE_PASSPHRASE: ${{ secrets.ME3_MOVE_PASSPHRASE }}
        run: |
          set -euo pipefail
          node scripts/move-restore.mjs restore \
            --source "$MOVE_DIR/source" \
            --archive "$MOVE_DIR/portable" \
            --work "$MOVE_DIR/work"

      - name: Remove restore files
        if: always()
        run: rm -rf "$MOVE_DIR"

      - name: Build ME3
        run: pnpm build

      - name: Deploy to Cloudflare
        run: pnpm exec wrangler deploy --config wrangler.toml
