# Hosted only. Deployed by ME3, never by an owner's installation.
# Cloudflare Workers Builds (Production account) deploys this Worker from this repository's `production`
# branch; promote `main` with a merge-commit PR. Don't run `wrangler deploy` by hand: a deploy from another
# checkout replaces whatever is live. Build settings (repository root):
#   build:  pnpm --filter @me3-core/free-runtime run typecheck && pnpm --filter @me3-core/free-runtime run test
#   deploy: pnpm --filter @me3-core/free-runtime run deploy
name = "me3-free-runtime"
main = "src/index.ts"
compatibility_date = "2026-06-24"
compatibility_flags = ["nodejs_compat"]

[build]
command = "node scripts/generate-migrations.mjs"

[observability]
enabled = true

[[durable_objects.bindings]]
name = "FREE_USER"
class_name = "Me3FreeUser"

[[durable_objects.bindings]]
name = "FREE_BUDGET"
class_name = "FreeBudget"

[[migrations]]
tag = "2026-11-21-free-user"
new_sqlite_classes = ["Me3FreeUser", "FreeBudget"]

[[rules]]
type = "Text"
globs = ["**/*.sql"]
fallthrough = true

[ai]
binding = "AI"
remote = true

[vars]
# Local runs pass --var ENVIRONMENT:local (see package.json and scripts/smoke.mjs).
ENVIRONMENT = "production"
# Free chat runs on Claude Haiku 5.5 (me3-bybb.6, eval 2026-11-22). DeepSeek is the backup when a Haiku
# call fails or is rate limited: separate providers, separate per-minute limits (me3-bybb.13).
ME3_AI_CHAT_PROVIDER = "anthropic"
ME3_AI_CHAT_MODEL = "claude-haiku-5.5"
ME3_AI_CHAT_BACKUP_MODEL = "@cf/deepseek-ai/deepseek-v4.1-flash-1017"
# Free AI goes through its own gateway, so its usage and cost show apart from paid installs and it has
# its own spend limit (me3-bybb.14). Created by hand on the Production account; logs and cache off.
CLOUDFLARE_AI_GATEWAY_ID = "me3-free"
# Follow-up suggestions and memory extraction use the same model as chat.
ME3_AGENT_FAST_MODEL = "anthropic/claude-haiku-5.5"
# "on" adds News (the morning paper) to the free plan.
ME3_FREE_NEWS = "on"

# Secrets: FREE_RUNTIME_SERVICE_TOKEN (shared with ME3 Cloud).
# Free chat limits are not config here: GET/POST /internal/budget changes them live.
