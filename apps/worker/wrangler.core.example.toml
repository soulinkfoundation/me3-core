name = "me3-core-worker"
main = "src/index.ts"
compatibility_date = "2026-06-24"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "ME3_USER_AGENT"
class_name = "Me3UserAgent"

[[durable_objects.bindings]]
name = "ME3_SDK_USER_AGENT"
class_name = "Me3SdkUserAgent"

[[migrations]]
tag = "2026-05-11-me3-core-user-agent"
new_sqlite_classes = ["Me3UserAgent"]

[[migrations]]
tag = "2026-10-01-me3-sdk-user-agent"
new_sqlite_classes = ["Me3SdkUserAgent"]

# Workers AI is the default Core chat provider. Wrangler connects this binding
# to Cloudflare's remote AI runtime during local development.
[ai]
binding = "AI"
remote = true

[images]
binding = "IMAGES"

[[d1_databases]]
binding = "DB"
database_name = "me3-core-db"
database_id = "00000000-0000-0000-0000-000000000000"

[[queues.producers]]
binding = "ASSISTANT_JOB_EVENTS"
queue = "me3-assistant-job-events"

[[queues.producers]]
binding = "BOOKING_REMINDER_QUEUE"
queue = "me3-booking-reminders"

[[queues.producers]]
binding = "SOCIAL_PUBLISH_QUEUE"
queue = "me3-social-publish"

[[queues.consumers]]
queue = "me3-assistant-job-events"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "me3-assistant-job-events-dlq"

[[queues.consumers]]
queue = "me3-booking-reminders"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "me3-booking-reminders-dlq"

[[queues.consumers]]
queue = "me3-social-publish"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 2
dead_letter_queue = "me3-social-publish-dlq"

[[queues.consumers]]
queue = "me3-assistant-job-events-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 0

[[queues.consumers]]
queue = "me3-booking-reminders-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 0

[[queues.consumers]]
queue = "me3-social-publish-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 0

[triggers]
crons = ["*/15 * * * *", "* * * * *"]

# Cloudflare Email Service sender binding. Account -> Email stores the sender
# address; this deploy-time binding lets the Worker call env.EMAIL.send().
[[send_email]]
name = "EMAIL"

[vars]
ENVIRONMENT = "local"
ME3_DEPLOYMENT_MODE = "self_hosted"
# Set per installation after the seeded and live canary checks pass.
# ME3_ASSISTANT_RUNTIME = "sdk"
# Managed-fleet provisioning sets both values below. Self-hosted installs must
# leave them unset; managed email then reuses the linked install's stored
# ME3_CORE_INSTALL_ID and ME3_CLOUD_CORE_TOKEN rather than provider credentials.
# ME3_MANAGED_INSTALLATION_ID = "mi-example"
# ME3_MANAGED_EMAIL_GATEWAY_ORIGIN = "https://mail.me3.app"
# Internal/evaluation only; never enable for managed production.
# ME3_AI_RAW_MODEL_SELECTION_ENABLED = "true"
CORE_WEB_ORIGIN = "http://localhost:4000"
CORE_API_ORIGIN = "http://localhost:8787"
# ME3_SITE_USERNAME = "owner"
ME3_AI_MODEL = "@cf/zai-org/glm-4.7-flash"
ME3_AI_CHAT_BACKUP_MODEL = "@cf/zai-org/glm-5.2"
ME3_VOICE_TRANSCRIPTION_PROVIDER = "cloudflare-whisper"
ME3_VOICE_TRANSCRIPTION_MODEL = "@cf/openai/whisper-large-v3-turbo"
# Optional override for the hosted Soulink assistant chat connector.
# Defaults to https://soulinkfoundation.org.
# SOULINK_API_ORIGIN = "https://soulinkfoundation.org"
# Optional: put PEXELS_API_KEY in apps/worker/.dev.vars to add relevant
# stock photography to Assistant-built landing-page drafts.
# Optional independent social OAuth bridge for self-hosted installs.
# The official https://api.me3.app bridge is reserved for managed installs.
# ME3_SOCIAL_OAUTH_ORIGIN = "http://localhost:8788"
