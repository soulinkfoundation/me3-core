name = "my-me3"
main = "apps/worker/src/index.ts"
compatibility_date = "2026-06-24"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[[durable_objects.bindings]]
name = "ME3_USER_AGENT"
class_name = "Me3UserAgent"

[[durable_objects.bindings]]
name = "ME3_AGENT"
class_name = "Me3Agent"

# Deployed installs (managed and self-hosted) never created the retired
# SDK user agent class, so this chain must not create or delete it.
[[migrations]]
tag = "2026-05-11-me3-core-user-agent"
new_sqlite_classes = ["Me3UserAgent"]

[[migrations]]
tag = "2026-10-10-me3-agent"
new_sqlite_classes = ["Me3Agent"]

[ai]
binding = "AI"

[images]
binding = "IMAGES"

[vars]
ME3_DEPLOYMENT_MODE = "self_hosted"
# The official ME3 OAuth bridge is managed-hosting only. Self-hosted installs
# configure provider credentials in the Social accounts screen.

[[d1_databases]]
binding = "DB"
database_name = "me3-core-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "apps/worker/migrations"

[[queues.producers]]
binding = "SOCIAL_PUBLISH_QUEUE"
queue = "me3-social-publish"

[[queues.consumers]]
queue = "me3-social-publish"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 2
dead_letter_queue = "me3-social-publish-dlq"

[[queues.consumers]]
queue = "me3-social-publish-dlq"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 0

[triggers]
crons = ["*/15 * * * *", "* * * * *"]

[assets]
directory = "apps/web/dist"
binding = "ASSETS"
# The Worker must see every request so it can route by hostname:
# saved custom domains serve the public site; admin/API hosts serve the SPA/API.
run_worker_first = ["/*"]
not_found_handling = "single-page-application"
